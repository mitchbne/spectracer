# Spectracer CI Pipeline
# Meta: Uses Spectracer to test Spectracer! 🔮
common:
  - buildkite_cache: &buildkite-cache
      buildkite/zstash:
        ids: "ruby-cache"

env:
  RUBY_VERSION: "3.3"
  SPECTRACER_TMP_DIRECTORY: "tmp/spectracer"

steps:
  # ============================================================================
  # Main Branch: Full suite with tracing
  # ============================================================================
  - group: ":crystal_ball: Full Suite with Tracing"
    key: "full-suite"
    if: build.branch == "main"
    steps:
      - label: ":rspec: RSpec with Tracing"
        key: "rspec-traced"
        command: |
          bundle install --jobs 4
          WITH_SPECTRACER_TRACING=true bundle exec rspec --exclude-pattern "spec/e2e/**/*_spec.rb" --format progress --format json --out tmp/rspec-results.json
        artifact_paths:
          - "tmp/spectracer/**/*"
          - "tmp/rspec-results.json"
        plugins: [*buildkite-cache]
      - label: ":test_tube: E2E RSpec"
        key: "e2e-rspec"
        command: |
          bundle install --jobs 4
          bundle exec rspec spec/e2e/rspec_integration_spec.rb --format progress
        plugins: [*buildkite-cache]

      - label: ":test_tube: E2E Minitest"
        key: "e2e-minitest"
        command: |
          bundle install --jobs 4
          bundle exec rspec spec/e2e/minitest_integration_spec.rb --format progress
        plugins: [*buildkite-cache]

      - label: ":package: Collect Dependencies"
        key: "collect-deps"
        depends_on: "rspec-traced"
        command: |
          bundle install --jobs 4
          buildkite-agent artifact download "tmp/spectracer/**/*" .
          bundle exec rake spectracer:collect_dependencies
          echo "--- Dependency map created"
          ls -la tmp/spectracer/
        artifact_paths:
          - "tmp/spectracer/dependencies.json.gz"
        plugins: [*buildkite-cache]
  # ============================================================================
  # Feature Branches: Run only affected specs (using Spectracer!)
  # ============================================================================
  - group: ":zap: Affected Specs Only"
    key: "affected-specs"
    if: build.branch != "main"
    steps:
      - label: ":mag: Determine Specs to Run"
        key: "determine-specs"
        command: |
          bundle install --jobs 4

          echo "--- Downloading dependency map from main branch"
          # Try to download latest dependencies from main
          buildkite-agent artifact download "tmp/spectracer/dependencies.json.gz" . \
            --build "latest" \
            --branch main || echo "No dependency map found, will run fallback"

          echo "--- Determining specs to run"
          if [ -f "tmp/spectracer/dependencies.json.gz" ]; then
            SPECS=$$(WITH_SPECTRACER_DEBUG=true bundle exec rake spectracer:spec_determiner 2>&1 | tee /dev/stderr | tail -1 | tr -d "'")
            echo "Specs to run: $$SPECS"

            if [ -z "$$SPECS" ] || [ "$$SPECS" = "" ]; then
              echo "No specs affected, running smoke tests"
              SPECS="spec/spectracer_spec.rb"
            fi
          else
            echo "No dependency map, running full suite"
            SPECS="spec"
          fi

          # Save specs to metadata for next step
          buildkite-agent meta-data set "specs-to-run" "$$SPECS"
        plugins: [*buildkite-cache]
      - label: ":rspec: Run Affected Specs"
        key: "run-affected"
        depends_on: "determine-specs"
        command: |
          bundle install --jobs 4

          SPECS=$$(buildkite-agent meta-data get "specs-to-run")
          echo "--- Running: $$SPECS"

          if [ "$$SPECS" = "spec" ]; then
            bundle exec rspec --exclude-pattern "spec/e2e/**/*_spec.rb" --format progress
          else
            # Handle comma-separated spec list
            SPEC_ARGS=$$(echo "$$SPECS" | tr ',' ' ')
            bundle exec rspec $$SPEC_ARGS --format progress
          fi
        artifact_paths:
          - "tmp/rspec-*.json"
        plugins: [*buildkite-cache]
      - label: ":test_tube: E2E RSpec"
        key: "e2e-rspec-branch"
        command: |
          bundle install --jobs 4
          bundle exec rspec spec/e2e/rspec_integration_spec.rb --format progress
        plugins: [*buildkite-cache]

      - label: ":test_tube: E2E Minitest"
        key: "e2e-minitest-branch"
        command: |
          bundle install --jobs 4
          bundle exec rspec spec/e2e/minitest_integration_spec.rb --format progress
        plugins: [*buildkite-cache]

  # ============================================================================
  # All Branches: Build verification
  # ============================================================================
  - label: ":standardrb: Lint"
    key: "lint"
    command: |
      bundle install --jobs 4
      bundle exec standardrb
    plugins: [*buildkite-cache]
          image: "ruby:${RUBY_VERSION}"

  - label: ":gem: Build Gem"
    key: "build-gem"
    command: |
      bundle install --jobs 4
      bundle exec rake build
      echo "--- Gem built successfully"
      ls -la pkg/
    artifact_paths:
      - "pkg/*.gem"
    plugins: [*buildkite-cache]
          image: "ruby:${RUBY_VERSION}"
